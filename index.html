<!doctype html>
<html lang="id">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>Video</title>
 <style>
 body{margin:0;background:#000;display:grid;place-items:center;min-height:100vh;font-family:system-ui}
 .wrap{width:min(900px,100vw);padding:12px;position:relative}
 video{width:100%;height:auto;background:#000;border-radius:12px}
 .overlay{
 position:absolute;inset:12px;display:grid;place-items:center;
 background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25));
 border-radius:12px;cursor:pointer;user-select:none
 }
 .btn{background:#fff;color:#000;padding:12px 16px;border-radius:999px;font-weight:700}
 </style>
</head>
<body>
 <div class="wrap">
 <video id="v" controls playsinline preload="metadata"></video>
 <div id="ov" class="overlay"><div class="btn">Play</div></div>
 </div>

 <script>
 const AD_URL = "https://cdn.vicey.co/HgFtyuB1.mp4";
 const MAIN_URL = "https://cdn.videy.co/SpqUwKtO1.mp4";

 const v = document.getElementById("v");
 const ov = document.getElementById("ov");

 let phase = "init"; // init -> ad -> main

 function setSrc(url){
 v.pause();
 v.removeAttribute("src");
 v.load();
 v.src = url;
 v.load();
 }

 ov.addEventListener("click", async () => {
 ov.style.display = "none";
 if (phase === "init") { setSrc(AD_URL); phase = "ad"; }
 try { await v.play(); } catch(e){ ov.style.display = ""; }
 });

 v.addEventListener("ended", async () => {
 if (phase === "ad") {
 setSrc(MAIN_URL);
 phase = "main";
 try { await v.play(); } catch(e){ ov.style.display = ""; }
 }
 });
 </script>
</body>
</html>
